[package]
name = "chaintree_staking"
version = "0.1.0"
description = "SPL Token Staking Program for ChainTree - Learn Solana by staking!"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "chaintree_staking"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
solana-program = "1.18.0"
